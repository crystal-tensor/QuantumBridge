name: Owner authorized one-time source and framework sync

on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-sync-20261027.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: owner-sync-20261027
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'crystal-tensor/QuantumBridge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify owner snapshot and preserve both histories
        shell: bash
        run: |
          set -euo pipefail
          bundle=owner-sync-20261027.bundle
          if [ ! -f "$bundle" ]; then
            echo 'Snapshot already consumed; nothing to sync.'
            exit 0
          fi
          echo 'c7f308683b897ff9c0e4cbedb1dcd5210a18fd95b9a06c8086787b234f2ed691  owner-sync-20261027.bundle' | sha256sum --check
          base=45fe338fc0f02de9c19e0af89723755952e5fc98
          snapshot=a25258573fe1b2ae4102ad80c9e9e0d1193ffd75
          git merge-base --is-ancestor "$base" origin/main
          unexpected=$(git diff --name-only "$base" origin/main | grep -Ev '^(owner-sync-20261027\.bundle|\.github/workflows/(owner-sync-20261027|test-matrix)\.yml)$' || true)
          if [ -n "$unexpected" ]; then
            printf 'Concurrent main changes require owner review:\n%s\n' "$unexpected"
            exit 1
          fi
          git bundle verify "$bundle"
          git fetch "$bundle" refs/heads/main:refs/remotes/owner-snapshot/main
          test "$(git rev-parse refs/remotes/owner-snapshot/main)" = "$snapshot"
          git merge-base --is-ancestor "$base" "$snapshot"
          # Workflow content is updated by the owner web session, never by this token.
          git diff --exit-code origin/main "$snapshot" -- .github/workflows/test-matrix.yml
          git config user.name 'QuantumBridge owner sync'
          git config user.email '29765585+crystal-tensor@users.noreply.github.com'
          git switch --detach "$snapshot"
          git merge --no-ff --no-commit origin/main
          git rm -- owner-sync-20261027.bundle
          git commit -m 'chore: synchronize owner-approved native SDK snapshot and framework'
          git push origin HEAD:main
          echo "Synchronized main: $(git rev-parse HEAD)"
      - name: Validate framework and generate static publication
        shell: bash
        run: |
          set -euo pipefail
          node studio/scripts/framework-check.mjs
          node --test studio/scripts/artifact-pages.test.mjs studio/scripts/build-public.test.mjs
          node studio/scripts/build-public.mjs "$RUNNER_TEMP/public-site" /QuantumBridge/
      - name: Publish static gh-pages branch without changing tags or releases
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo 'gh-pages already exists; refusing to overwrite it.'
            exit 1
          fi
          pages="$RUNNER_TEMP/framework-pages"
          git worktree add --detach "$pages"
          git -C "$pages" checkout --orphan gh-pages
          git -C "$pages" rm -rf -- .
          cp -R "$RUNNER_TEMP/public-site/." "$pages/"
          git -C "$pages" add --all
          git -C "$pages" commit -m 'docs: publish bilingual four-domain application framework'
          git push origin refs/heads/gh-pages:refs/heads/gh-pages
          echo 'Ready for GitHub Pages: gh-pages / (root)'
