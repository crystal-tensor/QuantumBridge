name: QuantumBridge Test Matrix

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core-only
            install: "python -m pip install -e . pytest"
            command: "pytest -q -rs"
          - profile: qiskit-extra
            install: "python -m pip install -e '.[qiskit]' pytest"
            command: "pytest -q -rs tests/compat/test_qiskit_adapter_realistic.py tests/compat/test_qiskit_import_basic_circuit.py tests/compat/test_qiskit_export_basic_circuit.py tests/compat/test_qiskit_roundtrip_ir.py"
          - profile: pennylane-extra
            install: "python -m pip install -e '.[pennylane]' pytest"
            command: "pytest -q -rs tests/compat/test_pennylane_adapter_realistic.py tests/compat/test_pennylane_installed_environment.py tests/qml/test_pennylane_observable_bridge.py tests/qml/test_pennylane_qnode_basic.py"
          - profile: dev
            install: "python -m pip install -e '.[dev]'"
            command: "pytest -q -rs && pytest --cov=quantumbridge"
          - profile: qiskit-aer-extra
            install: "python -m pip install -e '.[qiskit-aer]' pytest"
            command: "pytest -q -rs tests/compat_qiskit_aer"
          - profile: qiskit-finance-extra
            install: "python -m pip install -e '.[qiskit-finance]' pytest"
            command: "pytest -q -rs tests/compat_qiskit_finance"
          - profile: qiskit-optimization-extra
            install: "python -m pip install -e '.[qiskit-optimization]' pytest"
            command: "pytest -q -rs tests/compat_qiskit_optimization"
          - profile: qiskit-machine-learning-extra
            install: "python -m pip install -e '.[qiskit-machine-learning]' pytest"
            command: "pytest -q -rs tests/compat_qiskit_machine_learning"
          - profile: pennylane-full-extra
            install: "python -m pip install -e '.[pennylane-full]' pytest"
            command: "pytest -q -rs tests/compat_pennylane_full"
          - profile: ecosystem-inventory
            install: "python -m pip install -e '.[dev]'"
            command: "python scripts/inventory_qiskit_core_api.py && python scripts/inventory_qiskit_aer_api.py && python scripts/inventory_qiskit_ibm_runtime_api.py && python scripts/inventory_qiskit_finance_api.py && python scripts/inventory_qiskit_optimization_api.py && python scripts/inventory_qiskit_machine_learning_api.py && python scripts/inventory_qiskit_experiments_api.py && python scripts/inventory_qiskit_addons_api.py && python scripts/inventory_pennylane_full_api.py && pytest -q -rs tests/ecosystem"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: ${{ matrix.install }}
      - run: ${{ matrix.command }}
