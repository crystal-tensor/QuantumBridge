name: QuantumBridge Test Matrix

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core-only
            install: "python -m pip install -e . pytest"
            command: "pytest -q -rs"
          - profile: qiskit-extra
            install: "python -m pip install -e '.[qiskit]' pytest"
            command: "pytest -q -rs tests/compat/test_qiskit_adapter_realistic.py tests/compat/test_qiskit_import_basic_circuit.py tests/compat/test_qiskit_export_basic_circuit.py tests/compat/test_qiskit_roundtrip_ir.py"
          - profile: pennylane-extra
            install: "python -m pip install -e '.[pennylane]' pytest"
            command: "pytest -q -rs tests/compat/test_pennylane_adapter_realistic.py tests/compat/test_pennylane_installed_environment.py tests/qml/test_pennylane_observable_bridge.py tests/qml/test_pennylane_qnode_basic.py"
          - profile: dev
            install: "python -m pip install -e '.[dev]'"
            command: "pytest -q -rs && pytest --cov=quantumbridge"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: ${{ matrix.install }}
      - run: ${{ matrix.command }}
