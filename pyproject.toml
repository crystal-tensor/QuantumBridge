[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumbridge-sdk"
version = "0.1.0rc1"
description = "Experimental QuantumBridge SDK P1 release-candidate subset with optional Qiskit and PennyLane compatibility adapters."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
  {name = "QuantumBridge Contributors"}
]
keywords = ["quantum", "sdk", "simulator", "experimental"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "numpy>=1.20"
]

[project.optional-dependencies]
qiskit = ["qiskit"]
qiskit-core = ["qiskit"]
qiskit-aer = ["qiskit-aer"]
qiskit-runtime = ["qiskit-ibm-runtime"]
qiskit-finance = ["qiskit-finance"]
qiskit-optimization = ["qiskit-optimization"]
qiskit-machine-learning = ["qiskit-machine-learning"]
qiskit-experiments = ["qiskit-experiments"]
qiskit-addons = [
  "qiskit-addon-sqd",
  "qiskit-addon-mpf",
  "qiskit-addon-aqc-tensor",
  "qiskit-addon-obp"
]
pennylane = ["pennylane", "autoray<0.8"]
pennylane-full = ["pennylane", "autoray<0.8"]
ecosystem-qiskit = [
  "qiskit",
  "qiskit-aer",
  "qiskit-finance",
  "qiskit-optimization",
  "qiskit-machine-learning"
]
ecosystem-chemistry = [
  "qiskit-nature",
  "qiskit-algorithms",
  "pyscf",
  "openfermion"
]
ecosystem-pennylane = ["pennylane", "autoray<0.8"]
torch = ["torch"]
jax = ["jax", "jaxlib"]
dev = ["pytest", "numpy", "pytest-cov"]

[tool.setuptools]
packages = {find = {include = ["quantumbridge*"]}}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
