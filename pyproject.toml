[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumbridge-sdk"
version = "0.1.0rc1"
description = "Experimental QuantumBridge SDK P1 release-candidate subset with optional Qiskit and PennyLane compatibility adapters."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
  {name = "QuantumBridge Contributors"}
]
keywords = ["quantum", "sdk", "simulator", "experimental"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
  "numpy>=1.20"
]

[project.optional-dependencies]
qiskit = ["qiskit"]
pennylane = ["pennylane", "autoray<0.8"]
torch = ["torch"]
jax = ["jax", "jaxlib"]
dev = ["pytest", "numpy", "pytest-cov"]

[tool.setuptools]
packages = {find = {include = ["quantumbridge*"]}}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
